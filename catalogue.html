<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Branch Catalogue - Online Bookstore</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<table>
    <tr>
        <td class="header-bg logo">LOGO</td>
        <td class="header-bg">Online Bookstore</td>
    </tr>

    <tr class="nav-bg">
        <td colspan="2">
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="registration.html">Registration</a>
            <a href="catalogue.html?branch=CSE">Catalogue</a>
            <a href="cart.html">Cart</a>
        </td>
    </tr>

    <tr>
        <td class="sidebar">
            <ul>
                <li><a href="catalogue.html?branch=CSE">CSE</a></li>
                <li><a href="catalogue.html?branch=ECE">ECE</a></li>
                <li><a href="catalogue.html?branch=EEE">EEE</a></li>
                <li><a href="catalogue.html?branch=CIVIL">CIVIL</a></li>
            </ul>
        </td>

        <td class="main-content">
            <h2 id="branchTitle">Book Catalogue</h2>
            <p id="branchDescription"></p>

            <table class="catalogue-table">
                <thead>
                    <tr>
                        <th>Cover</th>
                        <th>Book Details</th>
                        <th>Price</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="bookList"></tbody>
            </table>

            <p><a href="cart.html">Go to Cart</a></p>
        </td>
    </tr>
</table>

<script>
const catalogues = {
    CSE: {
        title: "Computer Science Engineering (CSE)",
        description: "Books for programming, software and computer science.",
        books: [
            {
                name: "XML Bible",
                author: "Elliotte Rusty Harold",
                publication: "Wiley",
                price: 40.5,
                image: "https://books.google.com/books/content?id=ScJQAAAAMAAJ&printsec=frontcover&img=1&zoom=1&source=gbs_api"
            },
            {
                name: "Artificial Intelligence: A Modern Approach",
                author: "Stuart Russell and Peter Norvig",
                publication: "Pearson",
                price: 63,
                image: "https://books.google.com/books/content?id=koFptAEACAAJ&printsec=frontcover&img=1&zoom=1&source=gbs_api"
            },
            {
                name: "Java: The Complete Reference",
                author: "Herbert Schildt",
                publication: "McGraw Hill",
                price: 35.5,
                image: "https://books.google.com/books/content?id=saj_wnV2xXoC&printsec=frontcover&img=1&zoom=1&source=gbs_api"
            }
        ]
    },

    ECE: {
        title: "Electronics and Communication Engineering (ECE)",
        description: "Books for electronics, circuits and communication systems.",
        books: [
            {
                name: "Electronic Devices and Circuit Theory",
                author: "Robert L. Boylestad",
                publication: "Pearson",
                price: 45,
                image: "https://books.google.com/books/content?id=9WLwLQEACAAJ&printsec=frontcover&img=1&zoom=1&source=gbs_api"
            },
            {
                name: "Microelectronic Circuits",
                author: "Adel S. Sedra and Kenneth C. Smith",
                publication: "Oxford University Press",
                price: 52,
                image: "https://books.google.com/books/content?id=idO-oQEACAAJ&printsec=frontcover&img=1&zoom=1&source=gbs_api"
            },
            {
                name: "Electronic Communication Systems",
                author: "George Kennedy",
                publication: "McGraw Hill",
                price: 39,
                image: "https://books.google.com/books/content?id=lbtQAAAAYAAJ&printsec=frontcover&img=1&zoom=1&source=gbs_api"
            }
        ]
    },

    EEE: {
        title: "Electrical and Electronics Engineering (EEE)",
        description: "Books for electrical machines, circuits and power systems.",
        books: [
            {
                name: "A Textbook of Electrical Technology",
                author: "B. L. Theraja and A. K. Theraja",
                publication: "S. Chand",
                price: 42,
                image: "https://books.google.com/books/content?id=e2XeT9H1miUC&printsec=frontcover&img=1&zoom=1&source=gbs_api"
            },
            {
                name: "Electrical Machinery",
                author: "P. S. Bimbhra",
                publication: "Khanna Publishers",
                price: 38,
                image: "https://rukminim2.flixcart.com/image/1366/1366/xif0q/7/3/4/electrical-machinery-resized-original-imadzdcy9tyxsnah.jpeg?q=90"
            },
            {
                name: "Modern Power System Analysis",
                author: "D. P. Kothari and I. J. Nagrath",
                publication: "McGraw Hill",
                price: 48,
                image: "https://books.google.com/books/content?id=eTr78ZAPZ_sC&printsec=frontcover&img=1&zoom=1&source=gbs_api"
            }
        ]
    },

    CIVIL: {
        title: "Civil Engineering (CIVIL)",
        description: "Books for surveying, construction and structural engineering.",
        books: [
            {
                name: "Building Materials",
                author: "S. K. Duggal",
                publication: "New Age International",
                price: 32,
                image: "https://wishallbook.com/wp-content/uploads/2020/09/WhatsApp-Image-2020-09-07-at-7.08.29-PM.jpeg"
            },
            {
                name: "Surveying",
                author: "B. C. Punmia",
                publication: "Laxmi Publications",
                price: 40,
                image: "https://books.google.com/books/content?id=Pmn0gRU8_psC&printsec=frontcover&img=1&zoom=1&source=gbs_api"
            },
            {
                name: "Strength of Materials",
                author: "R. K. Bansal",
                publication: "Laxmi Publications",
                price: 36,
                image: "https://books.google.co.in/books/content?id=2IHEqp8dNWwC&pg=PP1&img=1&zoom=3&hl=en&sig=ACfU3U1LJL4EmJxVzrY_uAvonSH2uYC1BA&w=1280"
            }
        ]
    }
};

const params = new URLSearchParams(window.location.search);
const requestedBranch = (params.get("branch") || "CSE").toUpperCase();
const branch = catalogues[requestedBranch] ? requestedBranch : "CSE";
const selectedCatalogue = catalogues[branch];

document.title = selectedCatalogue.title + " - Online Bookstore";
document.getElementById("branchTitle").textContent =
    selectedCatalogue.title;
document.getElementById("branchDescription").textContent =
    selectedCatalogue.description;

const bookList = document.getElementById("bookList");

selectedCatalogue.books.forEach(book => {
    const row = document.createElement("tr");

    const cover = document.createElement("td");
    const coverImg = document.createElement("img");

    coverImg.className = "book-img";
    coverImg.alt = book.name + " cover";
    coverImg.src = book.image;

    cover.appendChild(coverImg);

    const details = document.createElement("td");

    const bookName = document.createElement("strong");
    bookName.textContent = "Book: ";
    details.appendChild(bookName);
    details.appendChild(document.createTextNode(book.name));

    details.appendChild(document.createElement("br"));

    const authorLabel = document.createElement("strong");
    authorLabel.textContent = "Author: ";
    details.appendChild(authorLabel);
    details.appendChild(document.createTextNode(book.author));

    details.appendChild(document.createElement("br"));

    const publicationLabel = document.createElement("strong");
    publicationLabel.textContent = "Publication: ";
    details.appendChild(publicationLabel);
    details.appendChild(document.createTextNode(book.publication));

    const price = document.createElement("td");
    price.textContent = "$" + book.price.toFixed(2);

    const action = document.createElement("td");
    const button = document.createElement("button");
    button.className = "btn";
    button.textContent = "Add to cart";

    button.addEventListener("click", () => {
        addToCart(book);
    });

    action.appendChild(button);

    row.append(cover, details, price, action);
    bookList.appendChild(row);
});

function addToCart(book) {
    let cart = JSON.parse(localStorage.getItem("bookCart") || "[]");

    const existing = cart.find(item => item.name === book.name);

    if (existing) {
        existing.quantity++;
    } else {
        cart.push({
            name: book.name,
            price: book.price,
            quantity: 1
        });
    }

    localStorage.setItem("bookCart", JSON.stringify(cart));
    alert(book.name + " added to cart!");
}
</script>

</body>
</html>
