<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bookstore Div Skeleton</title>
  <style>
    /* Minimal borders and colors to visualize the div layout structure */
    body { font-family: Arial,; margin:0; }
    
    .container { border: 2px solid black; margin: 10px; padding: 10px; }
    .header { border: 2px dashed #d97706; padding: 10px; margin-bottom: 10px; }
    .header-top { display: flex; border: 1px solid #d97706; padding: 5px; margin-bottom: 5px; }
    .logo { border: 1px solid #333; padding: 5px; width: 20px; }
    .title { border: 1px solid #333; padding: 5px; flex-grow: 1; text-align: center; }
    
    .nav-bar { display: flex; justify-content: space-between; border: 1px solid #d97706; padding: 5px; }
    .nav-item { border: 1px solid #666; padding: 5px; flex: 1; text-align: center; }

    .main-body { display: flex; border: 2px dashed #2563eb; padding: 10px; }
    .sidebar { width: 25%; border: 1px solid #2563eb; padding: 10px; margin-right: 10px; }
    .sidebar-item { border: 1px solid #93c5fd; padding: 5px; margin-bottom: 5px; }

    .content { width: 75%; border: 1px solid #2563eb; padding: 10px; }
    .content-box { border: 1px solid #10b981; padding: 15px; margin-bottom: 10px; }
  </style>
</head>
<body>


  <div class="container">

   
    <div class="header">
  
      <div class="header-top">
        <div class="logo"><a href="https://www.glbitm.org/"><img src="C:\Users\user\Downloads"></a></div>
        <div class="title">WebSite Name</div>
      </div>

     
      <div class="nav-bar">
        <div class="nav-item">Home</div>
        <div class="nav-item">Login</div>
        <div class="nav-item">Registration</div>
        <div class="nav-item">Catalogue</div>
        <div class="nav-item">Cart</div>
      </div>

    </div>

  
    <div class="main-body">


      <div class="sidebar">
        <div class="sidebar-item">CSE</div>
        <div class="sidebar-item">ECE</div>
        <div class="sidebar-item">EEE</div>
        <div class="sidebar-item">CIVIL</div>
      </div>


      <div class="content">

            <div class="content-box">
          <h3>Description of the WebSite</h3>
        </div>

      </div>

    </div>

  </div>

</body>
</html>
